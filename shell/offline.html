<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нет связи</title>
<style>
:root{--bg:#F2F4F6;--ink:#141A22;--muted:#5E6875;--accent:#1F6B5C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1317;--ink:#E7ECF1;--muted:#9AA5B1;--accent:#5CC4AE}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,Roboto,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);margin:0 0 20px;line-height:1.5}
button{background:var(--accent);color:var(--bg);border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:600}
</style>
</head>
<body>
<div>
  <h1>Нет интернета</h1>
  <p>Список дел загрузится, когда появится связь.<br>Уже поставленные напоминания сработают и без интернета.</p>
  <button onclick="location.href='https://ripsanches.github.io/denj/'">Попробовать снова</button>
</div>
</body>
</html>
